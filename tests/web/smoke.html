  delayMs: 0               // 测试可注入延迟（竞态断言用）
};
window.__smoke = __smoke; // U2.0：便于探针/外部工具读取（旧经典脚本时代本就全局可见）

function __stubResponse(body, status) {
  status = status || (body && body.ok === false ? 400 : 200);
  return {
    ok: status < 400,
    status: status,
    json: function () { return Promise.resolve(JSON.parse(JSON.stringify(body))); }
  };
}

window.fetch = function (url, options) {
  options = options || {};
  const method = (options.method || "GET").toUpperCase();
  let payload = null;
  try { payload = options.body ? JSON.parse(options.body) : null; } catch (e) { payload = null; }
  const entry = { url: String(url), method: method, body: payload };
  __smoke.fetchLog.push(entry);
  const key = method + " " + String(url).split("?")[0];
  const respond = () => {
    if (Object.prototype.hasOwnProperty.call(__smoke.routes, key)) {
      const override = __smoke.routes[key];
      if (override && override.__status) {
        return __stubResponse(override.body, override.__status);
      }
      return __stubResponse(override);
    }
    if (key === "GET /api/health") return __stubResponse(SAMPLES.healthOk);
    if (key === "GET /api/settings") return __stubResponse(SAMPLES.settingsGet);
    if (key === "POST /api/settings") return __stubResponse({ ok: true, settings: SAMPLES.settingsGet.settings, message: "设置已保存" });
    if (key === "POST /api/browse") return __stubResponse(SAMPLES.browseOk);
    if (key === "GET /api/fullscan/status") return __stubResponse(SAMPLES.fullscanStatusIdle);
    if (key === "GET /api/snapshots") return __stubResponse(SAMPLES.snapshotsList);
    if (key === "POST /api/save") return __stubResponse({ ok: true, message: "保存完成", session: SAMPLES.snapshotsList.sessions[0], session_file: "C:\\fake\\session.json", skipped: false });

       A16 覆写 OPTIONS→404 验证特性检测隐藏停止按钮 */
    if (key === "OPTIONS /api/fullscan/stop") return __stubResponse({ ok: true }, 200);
    if (key === "POST /api/fullscan/stop") return __stubResponse({ ok: true, stopped: false, status: SAMPLES.fullscanStatusIdle.status });

    return __stubResponse(SAMPLES.errorLegacyShape, 400);
  };
  if (__smoke.delayMs > 0) {
    return new Promise((resolve) => setTimeout(() => resolve(respond()), __smoke.delayMs));
  }
  return Promise.resolve(respond());
};

/* ---- 断言框架 ---- */
function __renderResults() {
  const passCount = __smoke.results.filter((r) => r.pass === true).length;
  const failCount = __smoke.results.filter((r) => r.pass === false).length;
  const total = __smoke.results.length;
  let html = "<table><tr><th>#</th><th>断言</th><th>结果</th><th>说明</th></tr>";
  __smoke.results.forEach((r) => {
    const cls = r.pass === true ? "pass" : r.pass === false ? "fail" : "pending";
    const label = r.pass === true ? "PASS" : r.pass === false ? "FAIL" : "待接入";
    html += "<tr><td>" + r.id + "</td><td>" + r.name + '</td><td class="' + cls + '">' + label + "</td><td>" + (r.detail || "") + "</td></tr>";
  });
  html += "</table>";
  document.getElementById("smoke-summary").innerHTML =
    '<b class="' + (failCount ? "fail" : "pass") + '">' +
    (failCount ? failCount + ' 项失败；' : "") +
    passCount + "/" + total + " 通过" + (failCount ? "" : (total ? " ✔" : "")) + "</b>";
  document.getElementById("smoke-table").innerHTML = html;
  // 自动化验证口：把结论写进标题（suite 名 + 通过数），浏览器标签/工具可直接读取
  document.title = "[suite=" + __currentSuite + "][" + (failCount ? "FAIL" : "PASS") + " " + passCount + "/" + total + "] " + document.title;
}

function __resetFormState() {
  // 浏览器 location.reload() 会恢复表单值；断言前强制回默认，保证确定性
  ["browse-filter", "browse-kind", "browse-sort"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === "INPUT") el.value = "";
    else el.selectedIndex = 0;
  });
}

async function __runAssertions(list) {
  __resetFormState();
  for (const item of list) {
    let pass = false, detail = "";
    if (typeof item.fn !== "function") {
      __smoke.results.push({ id: item.id, name: item.name, pass: null, detail: "后续阶段接入" });
      continue;
    }
    try {
      await item.fn();
      pass = true;
    } catch (e) {
      pass = false;
      detail = e && e.message ? e.message : String(e);
    }
    __smoke.results.push({ id: item.id, name: item.name, pass: pass, detail: detail });
  }
  __renderResults();
}

function __assert(cond, message) {
  if (!cond) throw new Error(message || "断言失败");
}

/* U2.3：条件等待（drill 时序：300ms 双击窗口 + 450ms FLIP + 入场；避免固定等待窗脆断） */
async function __waitUntil(fn, timeoutMs) {
  const deadline = Date.now() + (timeoutMs || 3000);
  while (Date.now() < deadline) {
    if (fn()) return true;
    await new Promise((r) => setTimeout(r, 100));
  }
  return fn();
}
