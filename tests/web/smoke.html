<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P12 前端零依赖冒烟页 · tests/web/smoke.html</title>
<style>

<body>
<h1>Python 磁盘扫描 · 冒烟页（stub 传输层，不发真实请求）</h1>
<p class="dim">直接双击用 Edge 打开即可（file:// 下同样有效）；页面底部显示「x/y 通过」即为绿。
任何触碰 web/static/js/app.js 的工作项，提交前必跑（P12 合并闸门）。</p>

<!-- ================= 最小 DOM 脚手架（结构复刻 index.html 中 app.js 依赖的节点） ================= -->
<header>
  <button id="health-badge" class="badge" title=""><span id="health-text">正在检查环境…</span></button>
  <button id="btn-guide"></button>
  <button id="btn-settings"></button>
</header>
<main>
  <section id="onboarding" class="hidden">
    <button id="btn-onboarding-close"></button>
    <ol class="steps hidden">
      <li class="step"><span class="step-num">4</span><div><b>对比与清空</b><p id="guide-step4-text">保存快照后，历史列表中每个盘符旁可「一键对比」；跨盘快照会先切换盘符再自动发起对比。</p></div></li>
    </ol>
  </section>
  <section id="overview-panel">
    <p id="overview-meta"></p>

  <section>

    </div>
    <input id="browse-root" list="roots-suggest" type="text" value="">

    <div id="recent-roots" class="chips-row hidden"></div>

      <select id="browse-sort"><option value="size-desc">按大小</option><option value="name-asc">按名称</option><option value="size-asc">大小最小</option></select>

    </div>

    <datalist id="baseline-suggest"></datalist>
    <button id="btn-compare"></button>

    <div id="compare-result" class="hidden">
      <div id="compare-summary"></div>
      <div id="compare-chart"></div>
      <table><thead><tr><th>变化</th><th>增速</th><th>路径</th><th id="compare-op-head" hidden>操作</th></tr></thead></table>
      <table><tbody id="compare-body"></tbody></table>
    </div>
  </section>
</main>

  <div class="modal-panel">
    <input id="setting-auto-save" type="checkbox">
    <input id="setting-data-dir" type="text" readonly>
    <input id="setting-health" type="text" readonly>
    <button id="btn-settings-save"></button>
    <button id="btn-wipe-open"></button>

</div>

  <div class="modal-panel">
    <span id="wipe-data-dir"></span>
    <input id="wipe-confirm" type="text">
    <button id="btn-wipe" disabled>确认清空</button>

</div>
<div id="confirm-modal" class="modal hidden">
  <div class="modal-panel">
    <h2 id="confirm-title">确认操作</h2>

    <button id="btn-confirm-ok"></button>
    <button id="btn-confirm-cancel"></button>
  </div>
</div>
<div id="toast-container"></div>

<script>
/* ============================================================
   P12 零依赖冒烟页（W1.2 建立，附录A）
   - 只 mock 传输层：整页替换 window.fetch，按 URL 返回预录响应；
   - 响应体逐字照抄真实接口 JSON 形态；错误样本同时覆盖旧形态
     {ok,error} 与新形态 {ok,error,detail,code}（RT-N04 双向容忍锚点）；
   - 断言通过计数器统计 fetch 调用次数与参数，而非看 UI 截图。
   ============================================================ */
"use strict";

/* ---- 真实形态样本（照抄后端响应键集合，勿手造简化体） ---- */
const SAMPLES = {
  healthOk: { ok: true, ready: true, dll: "C:\\Program Files\\Everything\\Everything64.dll", message: "Everything 已就绪" },
  healthBusy: { ok: true, ready: false, busy: true, reason: "scanning", dll: "C:\\Program Files\\Everything\\Everything64.dll", message: "Everything 正在扫描中（健康检查暂缓探测）" },
  settingsGet: { ok: true, settings: { auto_save: false, last_roots: ["D:\\"] }, data_dir: "%LOCALAPPDATA%\\PythonDiskScanner", snapshots_dir: "%LOCALAPPDATA%\\PythonDiskScanner\\snapshots" },
  browseOk: {
    ok: true,
    root: "D:\\",
    parent: null,
    directories: [
      { name: "data", path: "D:\\data", is_dir: true, size: 12000, size_human: "11.72 KB" },
      { name: "docs", path: "D:\\docs", is_dir: true, size: 4000, size_human: "3.91 KB" }
    ],
    files: [
      { name: "pagefile.sys", path: "D:\\pagefile.sys", is_dir: false, size: 999999, size_human: "976.56 KB" },
      { name: "readme.txt", path: "D:\\readme.txt", is_dir: false, size: 100, size_human: "100 B" }
    ],
    total_dirs: 2, total_files: 2
  },
  browseSlow: { ok: true, root: "D:\\slowDir", parent: null,
    directories: [{ name: "sdir", path: "D:\\slowDir\\sdir", is_dir: true, size: 10, size_human: "10 B" }],
    files: [], total_dirs: 1, total_files: 0 },
  browseFast: { ok: true, root: "D:\\fastDir", parent: null,
    directories: [{ name: "fdir", path: "D:\\fastDir\\fdir", is_dir: true, size: 20, size_human: "20 B" }],
    files: [], total_dirs: 1, total_files: 0 },
  fullscanStatusIdle: { ok: true, status: { running: false, roots: ["C:\\"], roots_done: 0, roots_total: 1, current_root: null, error: null, result_ready: false, save_ready: false, progress_pct: 0, scan_version: 1 } },
  snapshotsList: { ok: true, sessions: [ { session_id: "s-20260824-000000-aabbccdd", auto: false, machine_guid: "aabbccdd-1234", created_at: "2026-08-24T10:00:00", roots: { "D:\\": { root: "D:\\", snapshot: "D_20260824_100000_explicit_aabbccd.snap.gz", snapshot_path: "C:\\fake\\snapshots\\D_20260824_100000_explicit_aabbccd.snap.gz", skipped: false } } } ], count: 1 },
  compareReport: { ok: true, report: { root: "D:\\", total_baseline: 16000, total_current: 15990, delta_total: -10, truncated: false, legacy_count: 0, rows: [ { path: "D:\\data", baseline: 12000, current: 11990, delta: -10, growth_pct: -0.0833, removed: false, added: false } ] } },
  /* 错误双形态（RT-N04）：旧 {ok,error} 与 新 {ok,error,detail,code} */
  errorLegacyShape: { ok: false, error: "路径不存在: X:\\nope" },
  errorTypedShape: { ok: false, error: "无法连接 Everything（未运行或权限不足）", code: 2, detail: "Session 0 服务态或未启动" }
};

/* ---- fetch 打桩 + 调用计数器 ---- */
const __smoke = {
  fetchLog: [],            // {url, method, body}
  results: [],             // {id, name, pass, detail}
  routes: {},              // 测试可覆写：{"POST /api/browse": {...}}
  delayMs: 0               // 测试可注入延迟（竞态断言用）
};

function __stubResponse(body, status) {
  status = status || (body && body.ok === false ? 400 : 200);
  return {
    ok: status < 400,
    status: status,
    json: function () { return Promise.resolve(JSON.parse(JSON.stringify(body))); }
  };
}

window.fetch = function (url, options) {
  options = options || {};
  const method = (options.method || "GET").toUpperCase();
  let payload = null;
  try { payload = options.body ? JSON.parse(options.body) : null; } catch (e) { payload = null; }
  const entry = { url: String(url), method: method, body: payload };
  __smoke.fetchLog.push(entry);
  const key = method + " " + String(url).split("?")[0];
  const respond = () => {
    if (Object.prototype.hasOwnProperty.call(__smoke.routes, key)) {
      const override = __smoke.routes[key];
      if (override && override.__status) {
        return __stubResponse(override.body, override.__status);
      }
      return __stubResponse(override);
    }
    if (key === "GET /api/health") return __stubResponse(SAMPLES.healthOk);
    if (key === "GET /api/settings") return __stubResponse(SAMPLES.settingsGet);
    if (key === "POST /api/settings") return __stubResponse({ ok: true, settings: SAMPLES.settingsGet.settings, message: "设置已保存" });
    if (key === "POST /api/browse") return __stubResponse(SAMPLES.browseOk);
    if (key === "GET /api/fullscan/status") return __stubResponse(SAMPLES.fullscanStatusIdle);
    if (key === "GET /api/snapshots") return __stubResponse(SAMPLES.snapshotsList);
    if (key === "POST /api/save") return __stubResponse({ ok: true, message: "保存完成", session: SAMPLES.snapshotsList.sessions[0], session_file: "C:\\fake\\session.json", skipped: false });
    if (key === "POST /api/save/undo") return __stubResponse({ ok: true, message: "已撤销最近一次保存", session_id: "s-1", deleted: [], undeleted: [] });
    if (key === "POST /api/compare") return __stubResponse(SAMPLES.compareReport);
    if (key === "GET /api/overview") return __stubResponse({ ok: true, ready: false, scanning: false, empty_reason: "no_scan", roots: [] });
    // 缺省：旧形态错误（渲染器必须容忍无 code/detail）
    return __stubResponse(SAMPLES.errorLegacyShape, 400);
  };
  if (__smoke.delayMs > 0) {
    return new Promise((resolve) => setTimeout(() => resolve(respond()), __smoke.delayMs));
  }
  return Promise.resolve(respond());
};

/* ---- 断言框架 ---- */
function __renderResults() {
  const passCount = __smoke.results.filter((r) => r.pass === true).length;
  const failCount = __smoke.results.filter((r) => r.pass === false).length;
  const total = __smoke.results.length;
  let html = "<table><tr><th>#</th><th>断言</th><th>结果</th><th>说明</th></tr>";
  __smoke.results.forEach((r) => {
    const cls = r.pass === true ? "pass" : r.pass === false ? "fail" : "pending";
    const label = r.pass === true ? "PASS" : r.pass === false ? "FAIL" : "待接入";
    html += "<tr><td>" + r.id + "</td><td>" + r.name + '</td><td class="' + cls + '">' + label + "</td><td>" + (r.detail || "") + "</td></tr>";
  });
  html += "</table>";
  document.getElementById("smoke-summary").innerHTML =
    '<b class="' + (failCount ? "fail" : "pass") + '">' +
    (failCount ? failCount + ' 项失败；' : "") +
    passCount + "/" + total + " 通过" + (failCount ? "" : (total ? " ✔" : "")) + "</b>";
  document.getElementById("smoke-table").innerHTML = html;
}

async function __runAssertions(list) {
  for (const item of list) {
    let pass = false, detail = "";
    if (typeof item.fn !== "function") {
      __smoke.results.push({ id: item.id, name: item.name, pass: null, detail: "后续阶段接入" });
      continue;
    }
    try {
      await item.fn();
      pass = true;
    } catch (e) {
      pass = false;
      detail = e && e.message ? e.message : String(e);
    }
    __smoke.results.push({ id: item.id, name: item.name, pass: pass, detail: detail });
  }
  __renderResults();
}

function __assert(cond, message) {
  if (!cond) throw new Error(message || "断言失败");
}

/* ---- 断言注册表（四断言随 W1.4/W2.5/W2.6/W2.1 接入；0 为骨架自检） ---- */
const ASSERTIONS = [
  { id: "0", name: "骨架自检：app.js 启动完成且首拉 /api/settings、浏览样本已渲染到 #dir-body",
    fn: async function () {
      __assert(document.querySelector("#dir-body .ranking-row"), "#dir-body 未渲染出行");
      const first = __smoke.fetchLog.find((e) => e.url === "/api/settings");
      __assert(first, "init 应首先拉取 /api/settings");
    } },
  { id: "w13", name: "W1.3：renderApiError 双形态容忍（新形态出码，旧形态无 code 区块）",
    fn: async function () {
      const box = document.createElement("div");
      renderApiError(box, { message: SAMPLES.errorTypedShape.error, code: SAMPLES.errorTypedShape.code, detail: SAMPLES.errorTypedShape.detail }, null);
      __assert(box.textContent.indexOf("错误码 2") !== -1, "新形态应显示错误码区块");
      __assert(box.textContent.indexOf(SAMPLES.errorTypedShape.detail) !== -1, "新形态应显示 detail 小字");
      const box2 = document.createElement("div");
      renderApiError(box2, { message: SAMPLES.errorLegacyShape.error }, null);
      __assert(box2.textContent.indexOf("错误码") === -1, "旧形态不得出现 code 区块（RT-N04 降级）");
      __assert(box2.textContent.indexOf(SAMPLES.errorLegacyShape.error) !== -1, "旧形态仍显示主文案");
    } },
  { id: "1", name: "断言①（W1.4）：文件行零请求",
    fn: async function () {
      // 骨架样本 browseOk 含 2 目录 + 2 文件，init 门控已渲染进 #dir-body
      __assert(document.querySelector("#dir-body .ranking-row[data-path]"), "应存在目录行");
      const staticRow = document.querySelector("#dir-body .ranking-row-static");
      __assert(staticRow, "应存在静态文件行（.ranking-row-static）");
      __assert(!staticRow.hasAttribute("data-path"), "文件行不得携带 data-path");
      __assert(!staticRow.hasAttribute("role"), "文件行不得有 role=button");
      __assert(!staticRow.hasAttribute("tabindex"), "文件行不得有 tabindex");
      __assert(document.querySelector('[data-path=""]') === null, "不得存在 data-path 为空字符串的行");

      __smoke.fetchLog.length = 0;
      staticRow.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      staticRow.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      staticRow.dispatchEvent(new KeyboardEvent("keydown", { key: " ", bubbles: true }));
      let browses = __smoke.fetchLog.filter((e) => e.url === "/api/browse").length;
      __assert(browses === 0, "点击/键盘静态文件行应产生 0 个 /api/browse，实际 " + browses);

      const dirRow = document.querySelector("#dir-body .ranking-row[data-path]");
      dirRow.click();
      await new Promise((r) => setTimeout(r, 40));
      browses = __smoke.fetchLog.filter((e) => e.url === "/api/browse").length;
      __assert(browses === 1, "点击目录行应恰好 1 次 /api/browse，实际 " + browses);
    } },
  { id: "2", name: "断言②（W2.5）：筛选空态出现清除按钮",
    fn: async function () {
      // D：空会话刷新后撤销按钮灰置（走真实 refreshSnapshots 路径）
      const savedRoute = __smoke.routes["GET /api/snapshots"];
      const savedCache = sessionsCache;
      __smoke.routes["GET /api/snapshots"] = { ok: true, sessions: [], count: 0 };
      try {
        await refreshSnapshots();
        __assert($("btn-undo-save").disabled === true, "无会话时撤销按钮应灰置");
        // 入口保险：空会话点击不弹确认框、直接 info toast
        const toastCountBefore = document.querySelectorAll("#toast-container .toast").length;
        await undoLastSave();
        __assert($("confirm-modal").classList.contains("hidden"), "空会话不得弹出危险确认");
        __assert(document.querySelectorAll("#toast-container .toast").length > toastCountBefore,
                 "空会话撤销应出 info 提示");
      } finally {
        if (savedRoute === undefined) delete __smoke.routes["GET /api/snapshots"];
        else __smoke.routes["GET /api/snapshots"] = savedRoute;
        sessionsCache = savedCache;
      }

      // H：筛选空态与一键清除
      $("browse-filter").value = "不存在的关键词xyz";
      if (APP_STATE.lastBrowseData) renderEntries(APP_STATE.lastBrowseData);
      const btn = document.getElementById("btn-clear-filter");
      __assert(btn, "筛选空态应出现「清除筛选」按钮");
      __assert(document.getElementById("dir-body").textContent.indexOf("无匹配") !== -1,
               "空态文案应出现");
      btn.click();
      await new Promise((r) => setTimeout(r, 10));
      __assert($("browse-filter").value === "", "点击清除后筛选参数应清空");
      __assert(document.querySelector("#dir-body .ranking-row"), "应恢复渲染原条目");
    } },
  { id: "3", name: "断言③（W2.6）：双弹窗 Esc 按打开逆序关闭栈顶；Tab 循环；R 守卫",
    fn: async function () {
      const browseCallsBefore = __smoke.fetchLog.filter((e) => e.url === "/api/browse").length;
      openModal("settings-modal");
      openModal("confirm-modal"); // 栈顶 = confirm-modal
      __assert(!$("settings-modal").classList.contains("hidden"), "设置弹窗应开启");
      __assert(!$("confirm-modal").classList.contains("hidden"), "确认弹窗应开启");
      // R 守卫：弹窗开着时按 R 不触发浏览
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "r", bubbles: true }));
      await new Promise((r) => setTimeout(r, 10));
      const browseCallsAfterR = __smoke.fetchLog.filter((e) => e.url === "/api/browse").length;
      __assert(browseCallsAfterR === browseCallsBefore, "弹窗开启时按 R 不得触发浏览请求");
      // Tab 循环：焦点不出栈顶面板
      const panel = $("confirm-modal").querySelector(".modal-panel") || $("confirm-modal");
      panel.querySelector("button,input,[tabindex]").focus();
      for (let i = 0; i < 5; i++) {
        document.dispatchEvent(new KeyboardEvent("keydown", { key: "Tab", bubbles: true, cancelable: true }));
      }
      __assert(panel.contains(document.activeElement), "Tab 循环后焦点必须仍在面板内");
      // Esc 逆序：先关 confirm（栈顶），再关 settings
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      await new Promise((r) => setTimeout(r, 10));
      __assert($("confirm-modal").classList.contains("hidden"), "第一次 Esc 应关栈顶 confirm-modal");
      __assert(!$("settings-modal").classList.contains("hidden"), "settings-modal 应保持开启");
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      await new Promise((r) => setTimeout(r, 10));
      __assert($("settings-modal").classList.contains("hidden"), "第二次 Esc 关 settings-modal");
    } },
  { id: "4", name: "断言④（W2.1）：busy health 徽章不降级、整页不进引导态、设置健康栏透出扫描中",
    fn: async function () {
      const savedRoute = __smoke.routes["GET /api/health"];
      __smoke.routes["GET /api/health"] = SAMPLES.healthBusy;
      try {
        const classBefore = $("health-badge").className;
        await refreshHealth();
        __assert($("health-text").textContent.indexOf("扫描中") !== -1,
                 "徽章文本应为中性「扫描中…」");
        __assert($("health-badge").className === classBefore,
                 "busy 时徽章 class 必须保持原状（不降级为 warn/err）");
        __assert($("browse-guide").classList.contains("hidden"),
                 "busy 不得把整页打回引导态（busy ≠ 未就绪）");
        await setStatusForSettingsHealth();
        __assert($("setting-health").value.indexOf("扫描中") !== -1,
                 "设置健康栏应显示扫描中");
      } finally {
        if (savedRoute === undefined) delete __smoke.routes["GET /api/health"];
