/* ---- fetch 打桩 + 调用计数器 ---- */
const __smoke = {
  fetchLog: [],            // {url, method, body}
  results: [],             // {id, name, pass, detail}
  routes: {},              // 测试可覆写：{"POST /api/browse": {...}}

};
window.__smoke = __smoke; // U2.0：便于探针/外部工具读取（旧经典脚本时代本就全局可见）

function __stubResponse(body, status) {
  status = status || (body && body.ok === false ? 400 : 200);
  return {
    ok: status < 400,
    status: status,
    json: function () { return Promise.resolve(JSON.parse(JSON.stringify(body))); }
  };
}

window.fetch = function (url, options) {
  options = options || {};
  const method = (options.method || "GET").toUpperCase();
  let payload = null;
  try { payload = options.body ? JSON.parse(options.body) : null; } catch (e) { payload = null; }
  const entry = { url: String(url), method: method, body: payload };
  __smoke.fetchLog.push(entry);
  const key = method + " " + String(url).split("?")[0];
  const respond = () => {
    if (Object.prototype.hasOwnProperty.call(__smoke.routes, key)) {
      const override = __smoke.routes[key];
      if (override && override.__status) {
        return __stubResponse(override.body, override.__status);
      }
      return __stubResponse(override);
    }
    if (key === "GET /api/health") return __stubResponse(SAMPLES.healthOk);
    if (key === "GET /api/settings") return __stubResponse(SAMPLES.settingsGet);
    if (key === "POST /api/settings") return __stubResponse({ ok: true, settings: SAMPLES.settingsGet.settings, message: "设置已保存" });
    if (key === "POST /api/browse") return __stubResponse(SAMPLES.browseOk);
    if (key === "GET /api/fullscan/status") return __stubResponse(SAMPLES.fullscanStatusIdle);
    if (key === "GET /api/snapshots") return __stubResponse(SAMPLES.snapshotsList);
    if (key === "POST /api/save") return __stubResponse({ ok: true, message: "保存完成", session: SAMPLES.snapshotsList.sessions[0], session_file: "C:\\fake\\session.json", skipped: false });
    if (key === "POST /api/save/undo") return __stubResponse({ ok: true, message: "已撤销最近一次保存", session_id: "s-1", deleted: [], undeleted: [] });
    if (key === "POST /api/compare") return __stubResponse(SAMPLES.compareReport);
    if (key === "GET /api/overview") return __stubResponse(SAMPLES.overviewOk);
    // 缺省：旧形态错误（渲染器必须容忍无 code/detail）
    return __stubResponse(SAMPLES.errorLegacyShape, 400);
  };
  if (__smoke.delayMs > 0) {
    return new Promise((resolve) => setTimeout(() => resolve(respond()), __smoke.delayMs));
  }
  return Promise.resolve(respond());
};

<script type="module">
/* ============================================================
   P12 零依赖冒烟页（W1.2 建立，附录A）· U2.0 起以 ES Module 运行
   - 断言通过计数器统计 fetch 调用次数与参数，而非看 UI 截图；
   - U2.0：app 逻辑经 main.js 显式导入（旧全局写法改为导入面；
     id/选择器全部不变）；传输层打桩在上一个经典脚本里（解析期执行）。
   ============================================================ */
import {
    $, APP_STATE, switchTheme, renderApiError, refreshHealth,
    setStatusForSettingsHealth, renderEntries, openModal,
    browsePath, getCurrentPath, getTreemapView,
} from "../../web/static/js/app/main.js";
import * as __motion from "../../web/static/js/app/motion.js";
window.__motion = __motion;

/* ---- 断言框架 ---- */
function __renderResults() {
  const passCount = __smoke.results.filter((r) => r.pass === true).length;
  const failCount = __smoke.results.filter((r) => r.pass === false).length;
  const total = __smoke.results.length;
  let html = "<table><tr><th>#</th><th>断言</th><th>结果</th><th>说明</th></tr>";
  __smoke.results.forEach((r) => {
    const cls = r.pass === true ? "pass" : r.pass === false ? "fail" : "pending";
    const label = r.pass === true ? "PASS" : r.pass === false ? "FAIL" : "待接入";
    html += "<tr><td>" + r.id + "</td><td>" + r.name + '</td><td class="' + cls + '">' + label + "</td><td>" + (r.detail || "") + "</td></tr>";
  });
  html += "</table>";
  document.getElementById("smoke-summary").innerHTML =
    '<b class="' + (failCount ? "fail" : "pass") + '">' +
    (failCount ? failCount + ' 项失败；' : "") +
    passCount + "/" + total + " 通过" + (failCount ? "" : (total ? " ✔" : "")) + "</b>";
  document.getElementById("smoke-table").innerHTML = html;
  // 自动化验证口：把结论写进标题（suite 名 + 通过数），浏览器标签/工具可直接读取
  document.title = "[suite=" + __currentSuite + "][" + (failCount ? "FAIL" : "PASS") + " " + passCount + "/" + total + "] " + document.title;
}

function __resetFormState() {
  // 浏览器 location.reload() 会恢复表单值；断言前强制回默认，保证确定性
  ["browse-filter", "browse-kind", "browse-sort"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === "INPUT") el.value = "";
    else el.selectedIndex = 0;
  });
}

async function __runAssertions(list) {
  __resetFormState();
  for (const item of list) {
    let pass = false, detail = "";
    if (typeof item.fn !== "function") {
      __smoke.results.push({ id: item.id, name: item.name, pass: null, detail: "后续阶段接入" });
      continue;
    }
    try {
      await item.fn();
      pass = true;
    } catch (e) {
      pass = false;
      detail = e && e.message ? e.message : String(e);
    }
    __smoke.results.push({ id: item.id, name: item.name, pass: pass, detail: detail });
  }
  __renderResults();
}

function __assert(cond, message) {
  if (!cond) throw new Error(message || "断言失败");
}

/* U2.3：条件等待（drill 时序：300ms 双击窗口 + 450ms FLIP + 入场；避免固定等待窗脆断） */
async function __waitUntil(fn, timeoutMs) {
  const deadline = Date.now() + (timeoutMs || 3000);
  while (Date.now() < deadline) {
    if (fn()) return true;
    await new Promise((r) => setTimeout(r, 100));
  }
  return fn();
}

/* ---- U2.5：v1 断言（ASSERTIONS）已退役删除——A4/A5/A6 以 v2 语义继续承担
       红线 #11/#12 验证；renderApiError 双形态（原 w13）并入 A0。 ---- */

/* ================= U1.0/U1.3：双 suite 门禁派发（U2.5：v1/legacy 断言在此退役，
   门禁仅剩 v2；?suite=v2 与默认一致，未知 suite 回落 v2） =================
   - URL 带 ?suite=xxx → 跑对应注册表；默认 = v2（门禁主口径）；
   - v1 注册表（ASSERTIONS）已于 U2.5 删除——v2-A4/A5/A6 语义核对通过后退役，
     legacy 依赖的 ids（btn-undo-save/快照卡等）仅受 bind 函数依赖约束保留。 */
const __suiteMatch = window.location.search.match(/[?&]suite=([^&]+)/);
const __currentSuite = __suiteMatch ? decodeURIComponent(__suiteMatch[1]) : "v2";

const ASSERTIONS_V2 = [
  { id: "A0", name: "骨架自检：页面加载、fetch 桩已接管、app 启动链完成（默认矩形图渲染）+ renderApiError 双形态容忍（红线#4，原 w13 并入）",
    fn: async function () {
      __assert(typeof __assert === "function", "__assert 必须可用");
      __assert(typeof window.fetch === "function", "fetch 桩必须就位");
      // fetch 桩已接管：init 首拉 /api/settings 必须落在调用日志里
      const first = __smoke.fetchLog.find((e) => e.url === "/api/settings");
      __assert(first, "init 应首先拉取 /api/settings（fetch 桩计数生效）");
      // U2.5：默认视图=矩形图（定稿 N01）——启动链完成 = 矩形图已出布局（tiles≥1）
      const view = getTreemapView();
      __assert(view, "默认视图应为矩形图：treemap 渲染器应已创建");
      __assert(view.getLayout().length >= 1, "矩形图应已有 tile 布局（启动链 browse→渲染完成）");
      __assert(!$("treemap-wrap").hasAttribute("hidden"), "默认视图 treemap 容器应可见");
      __assert($("table-wrap").classList.contains("hidden"), "默认视图表格容器应隐藏");
      // 红线#4（原 legacy w13）：renderApiError 新形态出码、旧形态无 code 区块
      const box = document.createElement("div");
      renderApiError(box, { message: SAMPLES.errorTypedShape.error, code: SAMPLES.errorTypedShape.code, detail: SAMPLES.errorTypedShape.detail }, null);
      __assert(box.textContent.indexOf("错误码 2") !== -1, "新形态应显示错误码区块");
      __assert(box.textContent.indexOf(SAMPLES.errorTypedShape.detail) !== -1, "新形态应显示 detail 小字");
      const box2 = document.createElement("div");
      renderApiError(box2, { message: SAMPLES.errorLegacyShape.error }, null);
      __assert(box2.textContent.indexOf("错误码") === -1, "旧形态不得出现 code 区块（RT-N04 降级）");
      __assert(box2.textContent.indexOf(SAMPLES.errorLegacyShape.error) !== -1, "旧形态仍显示主文案");
    } },
  { id: "A1", name: "U1.1：主题切换（data-theme 切换 + localStorage 写入 + reduced 直切分支）",
    fn: async function () {
      __assert(typeof switchTheme === "function", "switchTheme 必须已定义");
      const root = document.documentElement;
      const before = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      const next = before === "dark" ? "light" : "dark";
      // 分支①：无事件坐标（ev=null）→ 直切（同时是 reduced/无 VT 的等效路径）
      switchTheme(next, null);
      __assert(root.getAttribute("data-theme") === next, "data-theme 应切换到 " + next);
      __assert(localStorage.getItem("pds_theme_v1") === next, "localStorage pds_theme_v1 应写入 " + next);
      // 分支②：带事件坐标（支持 VT 时走圆形扩散；结束后终态一致）
      switchTheme(before, { clientX: 10, clientY: 10 });
      await new Promise((r) => setTimeout(r, 80));
      __assert(root.getAttribute("data-theme") === before, "带坐标切换后 data-theme 应回到 " + before);
      __assert(localStorage.getItem("pds_theme_v1") === before, "localStorage 应同步回 " + before);
      // 分支③：非法值回退为翻转语义
      switchTheme("bogus", null);
      const flipped = root.getAttribute("data-theme");
      __assert(flipped === "dark" || flipped === "light", "非法入参应回退为合法主题，实际 " + flipped);
      switchTheme(before, null); // 复位，不污染其他断言
    } },
  { id: "A2", name: "U1.3：零滚动（body.scrollHeight ≤ innerHeight+1，App Shell 单屏 §3.4 规则1）",
    fn: async function () {
      const sh = document.body.scrollHeight;
      const ch = document.body.clientHeight;
      const ih = window.innerHeight;
      __assert(sh <= ih + 1, "body.scrollHeight=" + sh + " 应 ≤ innerHeight+1=" + (ih + 1));
      __assert(sh - ch <= 1, "scrollHeight(" + sh + ") - clientHeight(" + ch + ") 应 ≤1");
      __assert(getComputedStyle(document.body).overflow === "hidden", "桌面端 body 应 overflow:hidden");
    } },
  { id: "A3", name: "U2.1：路由（未知路由回落 #/；切页后 state.route 正确、页面切换渲染、往返状态保持）",
    fn: async function () {
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      // 初始：工作台已在位（route-view 内含 workspace 内容）
      __assert(APP_STATE.route === "/", "初始 route 应为 /，实际 " + APP_STATE.route);
      __assert($("dir-body"), "初始应渲染工作台页（dir-body 在位）");
      // 未知路由 → 回落 /
      location.hash = "#/no-such-page";
      await wait(600);
      __assert(APP_STATE.route === "/", "未知路由应回落 /，实际 " + APP_STATE.route);
      __assert($("dir-body"), "回落后应渲染工作台页");
      // 切页：#/compare → state.route + compare 页渲染
      location.hash = "#/compare";
      await wait(600);
      __assert(APP_STATE.route === "/compare", "切页后 route 应为 /compare，实际 " + APP_STATE.route);
      __assert(document.querySelector("#route-view [data-page='compare']"), "应渲染 compare 占位页");
      __assert(!$("dir-body"), "子页面不应保留工作台 DOM（dir-body 应被替换）");
      // 切页：#/snapshots
      location.hash = "#/snapshots";
      await wait(600);
      __assert(APP_STATE.route === "/snapshots", "切页后 route 应为 /snapshots，实际 " + APP_STATE.route);
      __assert(document.querySelector("#route-view [data-page='snapshots']"), "应渲染 snapshots 占位页");
      // 返回主页：浏览状态保持（模块级状态跨页不丢）
      location.hash = "#/";
      await wait(600);
      __assert(APP_STATE.route === "/", "返回后 route 应为 /");
      __assert($("dir-body"), "返回后工作台应重新渲染");

      __assert(!$("list-selected-actions").hasAttribute("hidden"), "选中后「定位所选/导出所选 CSV」应出现");
      __assert($("check-all").indeterminate === true, "部分选中时表头应为半选态");
      // Shift 范围选（anchor=item0 → 点击 item2：0..2 全选 = 3 项）
      boxes()[2].dispatchEvent(new MouseEvent("click", { bubbles: true, shiftKey: true }));
      await wait(10);
      __assert($("list-selected").textContent.indexOf("已选 3 项") !== -1, "Shift 范围选应「已选 3 项」（0..2），实际「" + $("list-selected").textContent + "」");
      // 第 4 项普通点选 → 全选 + 表头 checked
      boxes()[3].click();
      await wait(10);
      __assert($("list-selected").textContent.indexOf("已选 4 项") !== -1, "补选后应「已选 4 项」");
      __assert($("check-all").checked === true, "全选后表头应为 checked 态");
      // 表头点击 = 清选
      $("check-all").click();
      await wait(10);
      __assert($("list-selected").textContent.indexOf("已选 0 项") !== -1, "表头点击后应清选");
      __assert($("list-selected-actions").hasAttribute("hidden"), "清选后操作组应隐藏");
      // 排行视图同样渲染 checkbox（N08 口径：表格/排行视图底部固定行 + 首列 checkbox）
      $("btn-view-ranking").click();
      await __waitUntil(() => document.querySelectorAll("#dir-body .ranking-row").length === 2, 2000);
      __assert(document.querySelectorAll("#dir-body .ranking-row[data-path]").length === 2, "排行视图应仍有 2 个目录行");
      __assert(document.querySelectorAll("#dir-body .row-check").length === 4, "排行视图也应渲染 checkbox 首列");
      // 恢复默认矩形图（N01），不污染后续断言
      $("btn-view-treemap").click();
      await wait(20);
      __assert(await __waitUntil(() => $("table-wrap").classList.contains("hidden"), 1500), "应恢复默认矩形图");
    } },
];
