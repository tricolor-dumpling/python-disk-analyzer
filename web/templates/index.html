<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Python 磁盘扫描 · 本地磁盘空间分析</title>
    <script>
      /* UI2·U1.1 防闪烁：样式表生效前定稿主题（localStorage → 系统偏好 → light） */
      (function () {
        var t = null;
        try { t = localStorage.getItem("pds_theme_v1"); } catch (e) { /* ignore */ }
        if (t !== "light" && t !== "dark") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- ============================================================
     UI 2.0（SpaceLens Pro）· App Shell（U1.3 骨架 + U2.1 路由化）
     单屏模型：顶栏 60px → 路由视区（#route-view，页面模块渲染）→ 状态栏 32px；
     body 零滚动；<900px 宽 / <640px 高恢复页面滚动（§3.4 声明例外）。
     壳级元素 static：顶栏 / 状态栏 / 命令面板位 / 弹窗族 / toast；
     页面级内容（工作台/对比/快照）由 router + pages/* 渲染进 #route-view。
     ============================================================ -->
<div class="app" id="app">

    <!-- ============ 顶栏（60px；§3.3 高度预算） ============ -->
    <header class="topbar" id="topbar">
        <div class="brand">
            <span class="brand-logo" aria-hidden="true">
                <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 13a8 8 0 0 1 8-8h1a8 8 0 0 1 0 16h-1a8 8 0 0 1-8-8Z"/>
                    <path d="M13 5l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z"/>
                </svg>
            </span>
            <div>
                <h1>Python 磁盘扫描</h1>
                <p class="brand-sub">空间分析工作台</p>
            </div>
        </div>
        <!-- [N13] 导航标签（U2.1 接线：原生锚点 → hashchange → router 转场；
             激活态 .is-active 由 router 维护；下划线滑动 L2-11 于 U3.1 补） -->
        <nav class="nav-tabs" aria-label="主导航">
            <a class="nav-tab is-active" href="#/" aria-current="page">工作台</a>
            <a class="nav-tab" href="#/compare">对比</a>
            <a class="nav-tab" href="#/snapshots">快照</a>
        </nav>
        <div class="topbar-right">
            <button id="health-badge" class="badge" title="点击查看 Everything 状态">
                <span id="health-text">正在检查环境…</span>
            </button>
            <button id="btn-guide" class="btn btn-ghost btn-sm" title="重新打开使用指引">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="9"/><path d="M9.2 9a2.8 2.8 0 0 1 5.6.6c0 1.8-2.6 2-2.6 3.4"/><circle cx="12" cy="17.2" r="0.4" fill="currentColor"/>
                </svg>
                使用指引
            </button>
            <button id="btn-theme" class="btn btn-ghost btn-sm" title="切换亮 / 暗主题">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                主题
            </button>
            <button id="btn-settings" class="btn btn-ghost btn-sm">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3.2"/>
                    <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08A1.7 1.7 0 0 0 10.12 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.11Z"/>
                </svg>
                设置
            </button>
        </div>
    </header>

    <!-- ============ 路由视区（flex:1；页面模块渲染；§3.3 布局预算由页面自持） ============ -->
    <div class="shell">
        <div id="route-view" class="route-view" aria-live="polite"></div>
    </div>

    <!-- ============ 状态栏（32px；F22） ============ -->
    <footer class="statusbar">
        <span class="statusbar-left">数据保存在 %LOCALAPPDATA%\PythonDiskScanner（快照、清单与配置） · v0.9.0-p12c</span>
        <span class="statusbar-right">Everything 驱动 · 本地服务仅监听 127.0.0.1</span>
    </footer>
</div>

<!-- [N02] 命令面板浮层位（U3.1 装配；全路由可用，Ctrl/⌘K 打开） -->
<div class="palette-slot" data-slot="palette" hidden></div>

<!-- 设置弹窗 -->
<div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="设置">
    <div class="modal-panel">
        <div class="modal-head">
            <h2>设置</h2>
            <button class="icon-btn" data-close="settings-modal" title="关闭">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <label class="switch-row">
                <span>
                    <b>扫描完成自动保存</b>
                    <span class="switch-hint">全量扫描完成后立即生成快照，可随时「撤销最近保存」</span>
                </span>
                <input id="setting-auto-save" type="checkbox" class="switch">
            </label>
            <div class="field">
                <label>数据目录</label>
                <input id="setting-data-dir" type="text" readonly value="正在读取…">
            </div>
            <div class="field">
                <label>Everything 状态</label>
                <input id="setting-health" type="text" readonly value="正在检查…">
            </div>
            <div class="divider"></div>
            <h3>危险操作</h3>
            <p class="muted">一键清空会删除数据目录下的全部快照、保存清单与配置文件，随后重建为空结构；配置将恢复默认。此操作不可恢复。</p>
            <button id="btn-wipe-open" class="btn btn-danger">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                </svg>
                一键清空数据目录…
            </button>
        </div>
        <div class="modal-foot">
            <button id="btn-settings-save" class="btn btn-primary">保存设置</button>
            <button class="btn" data-close="settings-modal">关闭</button>
        </div>
    </div>
</div>

<!-- 清空确认弹窗 -->
<div id="wipe-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="确认清空">
    <div class="modal-panel modal-panel-sm">
        <div class="modal-head">
            <h2>确认清空数据目录</h2>
            <button class="icon-btn" data-close="wipe-modal" title="关闭">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <p class="notice notice-error">
                <b>⚠ 不可恢复：</b>将删除数据目录下全部快照、保存清单与配置文件（<span id="wipe-data-dir" class="muted">数据目录</span>）。
            </p>
            <p class="muted">为防止误删，请输入「<b>确认清空</b>」四个字以继续：</p>
            <input id="wipe-confirm" type="text" placeholder="确认清空" autocomplete="off">
        </div>
        <div class="modal-foot">
            <button id="btn-wipe" class="btn btn-danger" disabled>确认清空</button>
            <button class="btn" data-close="wipe-modal">取消</button>
        </div>
    </div>
</div>

<!-- 通用确认弹窗 -->
<div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="确认操作">
    <div class="modal-panel modal-panel-sm">
        <div class="modal-head">
            <h2 id="confirm-title">确认操作</h2>
            <button class="icon-btn" data-close="confirm-modal" title="关闭">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <p id="confirm-text"></p>
        </div>
        <div class="modal-foot">
            <button id="btn-confirm-ok" class="btn btn-danger">确定</button>
            <button id="btn-confirm-cancel" class="btn">取消</button>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container" aria-live="polite"></div>

<script type="module" src="{{ url_for('static', filename='js/app/main.js') }}"></script>
</body>
</html>
